    // Map init
    const map = L.map("map");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 20,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // Helper: create a numbered DivIcon
    function numberedIcon(label, cls) {
      return L.divIcon({
        className: "",
        html: `<div class="num-marker ${cls}">${label}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    const polesLayer = L.layerGroup().addTo(map);
    const intersectionsLayer = L.layerGroup().addTo(map);
    const edgesLayer = L.layerGroup().addTo(map);

    const pointLatLngs = [];

    // Add markers and edges
    geojson.features.forEach(f => {
      const geomType = f.geometry && f.geometry.type;

      if (geomType === "Point") {
        const [lon, lat] = f.geometry.coordinates;
        pointLatLngs.push([lat, lon]);

        const id = f.properties.id;
        const isIntersection = f.properties.kind === "intersection";

        const marker = L.marker([lat, lon], {
          icon: numberedIcon(String(id), isIntersection ? "intersection" : "pole")
        });

        marker.bindPopup(
          `<b>ID:</b> ${id}<br>` +
          `<b>Block:</b> ${f.properties.BLOCK}<br>` +
          `<b>Type:</b> ${isIntersection ? "intersection" : "pole"}<br>` +
          `<b>Lat:</b> ${lat}<br>` +
          `<b>Lon:</b> ${lon}`
        );

        (isIntersection ? intersectionsLayer : polesLayer).addLayer(marker);
        return;
      }

      if (geomType === "LineString" && f.properties && f.properties.type === "edge") {
        const latlngs = f.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
        latlngs.forEach(ll => pointLatLngs.push(ll));

        const u = f.properties.u;
        const v = f.properties.v;
        const cost = f.properties.cost_m;

        const line = L.polyline(latlngs, {
          weight: 4,
          opacity: 0.9
        });

        line.bindPopup(
          `<b>Edge:</b> ${u} → ${v}<br>` +
          `<b>Cost (m):</b> ${cost}`
        );

        edgesLayer.addLayer(line);
        return;
      }
    });

    // Fit bounds to all geometries (points + edges)
    if (pointLatLngs.length) {
      const bounds = L.latLngBounds(pointLatLngs);
      map.fitBounds(bounds.pad(0.2));
    } else {
      map.setView([8.2317, 124.2392], 18);
    }

    // Layer toggle
    L.control.layers(null, {
      "Poles": polesLayer,
      "Intersections": intersectionsLayer,
      "Edges": edgesLayer
    }, { collapsed: false }).addTo(map);
  </script>
